# The pip wheels: built once, then installed on each platform they are for.
# Publishing stays manual: download the "wheels" artifact, then
#   twine upload raytrace-*.whl
name: pip wheels

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['python/**', 'package.json', '.github/workflows/pip.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 python/build_wheels.py
      - run: pip install twine && twine check python/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: python/dist/*.whl

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pip chooses among all six wheels, as it would from PyPI.
      - run: python -m pip install --no-index --find-links wheels raytrace
      - run: raytrace --version
      - name: MCP server lists its tools
        run: |
          python - <<'PY'
          import json, subprocess
          lines = [{'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {'protocolVersion': '2025-06-18', 'capabilities': {}, 'clientInfo': {'name': 'ci', 'version': '1'}}},
                   {'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}]
          out = subprocess.run(['raytrace', 'mcp'], input=''.join(json.dumps(l) + '\n' for l in lines),
                               capture_output=True, text=True, timeout=60, shell=False).stdout
          replies = [json.loads(l) for l in out.splitlines() if l.strip()]
          tools = next(r['result']['tools'] for r in replies if r.get('id') == 2)
          print(len(tools), 'tools'); assert len(tools) > 5
          PY
      - run: raytrace doctor || true
