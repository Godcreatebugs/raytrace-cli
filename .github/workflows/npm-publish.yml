name: Publish npm package

# Diagnostic branch only, never merged: asks npm for a publish token the way
# `npm publish` does and prints npm's answer. Publishes nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'unused'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Ask npm for a publish token
        run: |
          node --input-type=module <<'JS'
          const env = process.env;
          const got = await fetch(`${env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org`, { headers: { authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          const id = (await got.json()).value;
          const claims = JSON.parse(Buffer.from(id.split('.')[1], 'base64url').toString());
          for (const key of ['iss', 'aud', 'sub', 'repository', 'repository_owner', 'repository_visibility', 'workflow_ref', 'job_workflow_ref', 'environment', 'ref', 'event_name', 'runner_environment']) console.log(key, '=', claims[key]);
          const answer = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@raytrace-cli%2fcli', { method: 'POST', headers: { authorization: `Bearer ${id}` } });
          const body = await answer.text();
          let shown = body;
          try { const parsed = JSON.parse(body); if (parsed.token) parsed.token = '(received)'; shown = JSON.stringify(parsed); } catch {}
          console.log('npm answered', answer.status, shown);
          JS
